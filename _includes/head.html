{%- assign page_title = page.title | default: site.long_title -%}
{%- assign page_desc = page.description | default: site.description | strip_newlines -%}
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }} — {{ site.title }}, {{ site.institute }}</title>
<meta name="description" content="{{ page_desc | escape }}">
<meta name="theme-color" content="#fafaf9">
<script>try{var t=localStorage.getItem("cvig-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}, {{ site.institute }}">
<meta property="og:title" content="{{ page_title }} — {{ site.title }}">
<meta property="og:description" content="{{ page_desc | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ site.og_image | absolute_url }}">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
{%- if page.hero3d %}
<link rel="stylesheet" href="{{ '/assets/css/hero3d.css' | relative_url }}">
{%- endif %}
{%- if page.cloud3d %}
<link rel="stylesheet" href="{{ '/assets/css/cloud3d.css' | relative_url }}">
{%- endif %}
<script src="{{ '/main.js' | relative_url }}" defer></script>
</head>
